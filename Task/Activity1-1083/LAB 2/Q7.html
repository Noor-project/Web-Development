<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
    .left {
        position: absolute;
        width: 60%;
        height: 120px;
        background: red;
        bottom: 20px;
        left: 20px;
    }

    .right {
        position: absolute;
        width: 40%;
        height: 100px;
        background: darkred;
        top: 20px;
        right: 20px;
    }
</style>
</head>
<body>
    <div class="left">Fluid Div 60%</div>
    <div class="right">Fluid Div 40%</div>
</div>

</body>
</html>
