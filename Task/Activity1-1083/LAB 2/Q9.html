<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting Text</title>
</head>
<body>

    <h3>Formatting Text</h3>
    font size -7 :
    <font size="7">HTML</font>
    <br><br>
    font size -3 :
    <font size="3">HTML</font>
    <br><br>
    font color - red :
    <font color="red">HTML</font>
    <br><br>
    font size-6 and color-red :
    <font size="6" color="red">HTML</font>
    <br><br>
    bold, underline and italic :
    <b><u><i>Text</i></u></b>
    <br><br>
    Bold :
    <b>HTML</b>
    <br>
    Strong :
    <strong>HTML</strong>
    <br>
    Underline :
    <u>HTML</u>
    <br>
    Ins :
    <ins>HTML</ins>
    <br>
    Italic :
    <i>HTML</i>
    <br>
    Emphasis :
    <em>HTML</em>
    <br>
    Strike :
    <strike>HTML</strike>
    <br>
    Del :
    <del>HTML</del>
    <br><br>
    Highlighting a text :
    <mark>HTML</mark>

</body>
</html>
