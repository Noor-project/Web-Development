<!DOCTYPE html>
<html>
<head>
<title>Contact Form</title>

<style>
body{
    font-family: Arial;
    background:#d8d1cd;
}

.container{
    width:800px;
    margin:auto;
    margin-top:40px;
    display:flex;
    gap:30px;
}

img{
    width:350px;
}

.form-box{
    width:350px;
}

input, textarea{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:15px;
}

.row{
    display:flex;
    gap:10px;
}

button{
    width:100%;
    padding:10px;
    background:#f47a3c;
    color:white;
    border:none;
    border-radius:20px;
}
</style>

</head>

<body>

<div class="container">

<div>
<img src="Laptop.jpg">
</div>

<div class="form-box">

<form>

<div class="row">
<div>
<label>Email</label>
<input type="email" placeholder="Enter a valid email">
</div>

<div>
<label>Name</label>
<input type="text" placeholder="Enter your Name">
</div>
</div>

<label>Address</label>
<input type="text" placeholder="Enter your address">

<label>Message</label>
<textarea rows="4" placeholder="Enter your message"></textarea>

<button>SUBMIT</button>

</form>

</div>

</div>

</body>
</html>
