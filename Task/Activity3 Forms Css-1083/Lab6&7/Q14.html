<!DOCTYPE html>
<html>
<head>
<title>Signup / Login</title>
</head>

<body style="font-family:Arial; background:white;">

<!-- SIGNUP FORM (LEFT - BIG) -->
<div style="background:#f2b632;padding:30px;display:inline-block;margin:30px;">
<div style="width:320px;background:#eee;padding:20px;border-radius:5px;">

<h3 style="text-align:center;border:2px dashed #f2b632;padding:10px;">Your Logo Here</h3>

<p>First name *</p>
<input type="text" style="width:100%;height:30px;border:1px solid #f2b632;">

<p>Last name *</p>
<input type="text" style="width:100%;height:30px;border:1px solid #f2b632;">

<p>Email address *</p>
<input type="text" style="width:100%;height:30px;border:1px solid #f2b632;">

<p>Password *</p>
<input type="password" style="width:100%;height:30px;border:1px solid #f2b632;">

<p>Again password *</p>
<input type="password" style="width:100%;height:30px;border:1px solid #f2b632;">

<br><br>

<span style="color:#f2b632;">Have an account</span>

<input type="button" value="Signup"
style="float:right;background:#f2b632;border:none;padding:10px 20px;color:white;">

</div>
</div>


<!-- LOGIN FORM (RIGHT - SMALL) -->
<div style="background:#f2b632;padding:30px;display:inline-block;margin:30px;">
<div style="width:320px;background:#eee;padding:20px;border-radius:5px;">

<h3 style="text-align:center;border:2px dashed #f2b632;padding:10px;">Your Logo Here</h3>

<p>Username or email address *</p>
<input type="text" style="width:100%;height:30px;border:1px solid #f2b632;">

<p>Password *</p>
<input type="password" style="width:100%;height:30px;border:1px solid #f2b632;">

<br><br>

<span style="color:#f2b632;">Forgot password?<br>Create an account</span>

<input type="button" value="Login"
style="float:right;background:#f2b632;border:none;padding:10px 20px;color:white;">

</div>
</div>

</body>
</html>
