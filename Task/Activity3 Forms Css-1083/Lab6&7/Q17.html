<!DOCTYPE html>
<html>
<head>
<title>ABC Company</title>

<style>

body{
font-family:Arial;
background:#ff3b4a;
margin:0;
}

/* white main box */
.main{
width:900px;
margin:50px auto;
background:white;
padding:30px;
}

/* top image */
.top img{
width:100%;
height:300px;
object-fit:cover;
}

/* city names */
.cities{
display:flex;
justify-content:space-around;
margin:20px 0;
font-weight:bold;
}

/* bottom section */
.bottom{
display:flex;
margin-top:30px;
}

/* form */
.form{
width:50%;
padding-right:20px;
}

.form h2{
font-size:30px;
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:4px;
}

button{
width:100%;
padding:12px;
background:#ff3b4a;
color:white;
border:none;
border-radius:4px;
}

/* map */
.map{
width:50%;
}

.map img{
width:100%;
height:350px;
object-fit:cover;
}

</style>
</head>

<body>

<div class="main">

<div class="top">
<img src="Building.png">
</div>

<div class="cities">
<div>Sydney</div>
<div>Melbourne</div>
<div>Los Angeles</div>
<div>London</div>
</div>

<div class="bottom">

<div class="form">
<h2>Get in Touch</h2>

<label>Name</label>
<input type="text" placeholder="Enter your Name">

<label>Email</label>
<input type="email" placeholder="Enter a valid email address">

<label>How can we help?</label>
<textarea rows="5"></textarea>

<button>SUBMIT</button>

</div>

<div class="map">
<img src="Map.jpg">
</div>

</div>
</div>
</body>
</html>
