<!DOCTYPE html>
<html>
<head>
<title>Login Signup</title>

<style>
body{
    font-family:Arial;
    background:#3f6edb;
}

.container{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-top:80px;
}

.box{
    background:white;
    padding:20px;
    width:260px;
    border-radius:10px;
}

h3{
    text-align:center;
}

input{
    width:100%;
    padding:8px;
    margin:8px 0;
}

.btn{
    width:100%;
    padding:8px;
    margin-top:5px;
    border:none;
    color:white;
}

.login-btn{
    background:#1e73be;
}

.fb{
    background:#3b5998;
}

.google{
    background:#db4437;
}
</style>

</head>

<body>

<div class="container">

<div class="box">
<h3>Login</h3>

<input type="email" placeholder="Email">
<input type="password" placeholder="Password">

<button class="btn login-btn">Login</button>

<p style="text-align:center;">Or</p>

<button class="btn fb">Login with Facebook</button>
<button class="btn google">Login with Google</button>

</div>


<div class="box">
<h3>Signup</h3>

<input type="email" placeholder="Email">
<input type="password" placeholder="Create password">
<input type="password" placeholder="Confirm password">

<button class="btn login-btn">Signup</button>

<p style="text-align:center;">Or</p>

<button class="btn fb">Login with Facebook</button>
<button class="btn google">Login with Google</button>

</div>

</div>

</body>
</html>
