<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-black">

    <!-- HEADER -->
    <header class="flex items-start p-6 gap-6">

        <!-- Profile Image -->
        <div class="w-100 h-100 flex-shrink-0">
            <img src="Girl.jpg" class="w-full h-full object-cover"/>
        </div>

        <!-- Form -->
        <div class="flex-1 max-w-xl ml-10">
            <h1 class="text-3xl font-bold mb-6">Contact Us</h1>

            <form class="flex flex-col gap-4">

                <!-- Name -->
                <div>
                    <label class="block mb-1 font-medium">Name:</label>
                    <input
                        type="text"
                        name="Name"
                        placeholder="Enter Your Name"
                        class="w-1/2 h-8 border-b-2 border-black bg-transparent outline-none px-1"
                    />
                </div>

                <!-- Email -->
                <div>
                    <label class="block mb-1 font-medium">Email:</label>
                    <input
                        type="email"
                        name="Email"
                        placeholder="Enter Your valid Email"
                        class="w-1/2 h-8 border-b-2 border-black bg-transparent outline-none px-1"
                    />
                </div>

                <!-- Message -->
                <div>
                    <label class="block mb-1 font-medium">Message:</label>
                    <textarea
                        name="Message"
                        rows="6"
                        placeholder="Enter Your Message"
                        class="w-full border-b-2 border-black bg-transparent outline-none px-1 resize-none"
                    ></textarea>
                </div>

                <!-- Checkbox -->
                <div class="flex items-center gap-2">
                    <input type="checkbox" class="w-4 h-4 accent-red-600 cursor-pointer"/>
                    <span class="text-sm">I agree to the terms and conditions</span>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-72 h-12 bg-red-600 text-white text-lg font-semibold border-2 border-red-600 rounded hover:bg-red-700 transition-colors duration-200"
                >
                    Submit
                </button>

            </form>
        </div>
    </header>

    <!-- SPACER -->
    <section class="h-28"></section>

    <!-- FOOTER -->
    <footer class="text-white text-center">
        <div class="flex justify-center">

            <!-- Call Us -->
            <div class="w-1/4 bg-red-600 py-6 px-4">
                <img src="Phone.jpg" class="w-8 mx-auto mb-2"/>
                <p class="text-xl font-bold">Call Us</p>
                <p class="text-base mt-2">1(234)567891</p>
                <p class="text-base">1(234)987654</p>
            </div>

            <!-- Location -->
            <div class="w-1/4 bg-red-600 py-6 px-4">
                <img src="Location.jpg" class="w-8 mx-auto mb-2"/>
                <p class="text-xl font-bold">Location</p>
                <p class="text-base mt-2">121 Rock Street, 21 Avenue, NewYork, NY</p>
                <p class="text-base">92103-90000</p>
            </div>

            <!-- Hours -->
            <div class="w-1/4 bg-red-600 py-6 px-4">
                <img src="Clock.jpg" class="w-8 mx-auto mb-2"/>
                <p class="text-xl font-bold">Hours</p>
                <p class="text-base mt-2">Mon-Fri: 11am - 8pm</p>
                <p class="text-base">Sat, Sun: 6pm - 8pm</p>
            </div>

        </div>
    </footer>

</body>
</html>
