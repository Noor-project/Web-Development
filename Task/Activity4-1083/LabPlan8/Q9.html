<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-[#3f6edb] min-h-screen">

    <!-- CONTAINER -->
    <div class="flex justify-center gap-10 mt-20 pb-10">

        <!-- LOGIN BOX -->
        <div class="bg-white p-5 w-64 rounded-xl shadow-md">

            <h3 class="text-center font-bold text-lg mb-2">Login</h3>

            <!-- Inputs -->
            <input type="email" placeholder="Email"
                class="w-full px-3 py-2 my-2 border border-gray-300 rounded outline-none focus:border-blue-500"/>

            <input type="password" placeholder="Password"
                class="w-full px-3 py-2 my-2 border border-gray-300 rounded outline-none focus:border-blue-500"/>

            <!-- Login Button -->
            <button class="w-full py-2 mt-1 bg-[#1e73be] text-white rounded hover:bg-blue-700 transition-colors duration-200">
                Login
            </button>

            <!-- Or -->
            <p class="text-center text-sm my-2 text-gray-500">Or</p>

            <!-- Facebook Button -->
            <button class="w-full py-2 bg-[#3b5998] text-white rounded hover:opacity-90 transition-opacity duration-200 mb-2">
                Login with Facebook
            </button>

            <!-- Google Button -->
            <button class="w-full py-2 bg-[#db4437] text-white rounded hover:opacity-90 transition-opacity duration-200">
                Login with Google
            </button>

        </div>

        <!-- SIGNUP BOX -->
        <div class="bg-white p-5 w-64 rounded-xl shadow-md">

            <h3 class="text-center font-bold text-lg mb-2">Signup</h3>

            <!-- Inputs -->
            <input type="email" placeholder="Email"
                class="w-full px-3 py-2 my-2 border border-gray-300 rounded outline-none focus:border-blue-500"/>

            <input type="password" placeholder="Create password"
                class="w-full px-3 py-2 my-2 border border-gray-300 rounded outline-none focus:border-blue-500"/>

            <input type="password" placeholder="Confirm password"
                class="w-full px-3 py-2 my-2 border border-gray-300 rounded outline-none focus:border-blue-500"/>

            <!-- Signup Button -->
            <button class="w-full py-2 mt-1 bg-[#1e73be] text-white rounded hover:bg-blue-700 transition-colors duration-200">
                Signup
            </button>

            <!-- Or -->
            <p class="text-center text-sm my-2 text-gray-500">Or</p>

            <!-- Facebook Button -->
            <button class="w-full py-2 bg-[#3b5998] text-white rounded hover:opacity-90 transition-opacity duration-200 mb-2">
                Login with Facebook
            </button>

            <!-- Google Button -->
            <button class="w-full py-2 bg-[#db4437] text-white rounded hover:opacity-90 transition-opacity duration-200">
                Login with Google
            </button>

        </div>

    </div>

</body>
</html>
