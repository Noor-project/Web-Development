<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Hotel - Book Your Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-10">

    <!-- MAIN WRAPPER -->
    <div class="flex items-center justify-center gap-0 w-full max-w-5xl">

        <!-- LEFT SIDE - IMAGE WITH ORANGE CIRCLES -->
        <div class="relative w-[500px] h-[500px] flex-shrink-0">

            <!-- Orange Circle TOP RIGHT -->
            <div class="absolute w-72 h-72 bg-orange-500 rounded-full top-0 right-16 z-0"></div>

            <!-- Orange Circle BOTTOM LEFT -->
            <div class="absolute w-72 h-72 bg-orange-500 rounded-full bottom-0 left-8 z-0"></div>

            <!-- Food Image CENTER -->
            <img
                src="food.png"
                alt="Food"
                class="absolute w-72 h-72 rounded-full object-cover z-10
                       top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2
                       shadow-xl"
            />

        </div>

        <!-- RIGHT SIDE - BOOKING FORM CARD -->
        <div class="bg-gray-100 rounded-3xl p-8 w-[480px] shadow-md flex-shrink-0">

            <!-- Title -->
            <h1 class="text-4xl font-light text-gray-800 mb-6">Book your table</h1>

            <!-- Phone + Name Row -->
            <div class="flex gap-4 mb-4">

                <!-- Phone -->
                <div class="flex-1">
                    <label class="block text-sm text-gray-600 mb-1">Phone</label>
                    <input
                        type="tel"
                        placeholder="Enter your phone (e.g. +1...)"
                        class="w-full px-4 py-2 rounded-xl bg-white border-none outline-none text-sm text-gray-400 shadow-sm"
                    />
                </div>

                <!-- Name -->
                <div class="flex-1">
                    <label class="block text-sm text-gray-600 mb-1">Name</label>
                    <input
                        type="text"
                        placeholder="Enter your Name"
                        class="w-full px-4 py-2 rounded-xl bg-white border-none outline-none text-sm text-gray-400 shadow-sm"
                    />
                </div>

            </div>

            <!-- Date -->
            <div class="mb-4">
                <label class="block text-sm text-gray-600 mb-1">Date</label>
                <input
                    type="date"
                    class="w-full px-4 py-2 rounded-xl bg-white border-none outline-none text-sm text-gray-400 shadow-sm"
                />
            </div>

            <!-- Message -->
            <div class="mb-6">
                <label class="block text-sm text-gray-600 mb-1">Message</label>
                <textarea
                    rows="4"
                    placeholder="Enter your message"
                    class="w-full px-4 py-2 rounded-xl bg-white border-none outline-none text-sm text-gray-400 shadow-sm resize-none"
                ></textarea>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="px-10 py-3 bg-[#4ab8d8] hover:bg-sky-400 active:scale-95 text-white font-bold text-sm rounded-full tracking-widest transition-all duration-200 shadow-md"
            >
                SUBMIT
            </button>

        </div>
    </div>

</body>
</html>
