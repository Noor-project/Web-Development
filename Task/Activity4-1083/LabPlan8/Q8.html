<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-[#d8d1cd] min-h-screen">

    <!-- MAIN CONTAINER -->
    <div class="w-[800px] mx-auto mt-10 flex gap-8 items-start">

        <!-- LEFT - IMAGE -->
        <div class="flex-shrink-0">
            <img src="Laptop.jpg" class="w-[350px] rounded"/>
        </div>

        <!-- RIGHT - FORM -->
        <div class="w-[350px]">
            <form class="flex flex-col">

                <!-- Email + Name Row -->
                <div class="flex gap-3 mb-1">

                    <!-- Email -->
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input
                            type="email"
                            placeholder="Enter a valid email"
                            class="w-full px-3 py-2 border border-gray-300 bg-white outline-none focus:border-orange-400 transition-colors mb-4"
                        />
                    </div>

                    <!-- Name -->
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                        <input
                            type="text"
                            placeholder="Enter your Name"
                            class="w-full px-3 py-2 border border-gray-300 bg-white outline-none focus:border-orange-400 transition-colors mb-4"
                        />
                    </div>

                </div>

                <!-- Address -->
                <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                <input
                    type="text"
                    placeholder="Enter your address"
                    class="w-full px-3 py-2 border border-gray-300 bg-white outline-none focus:border-orange-400 transition-colors mb-4"
                />

                <!-- Message -->
                <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                <textarea
                    rows="4"
                    placeholder="Enter your message"
                    class="w-full px-3 py-2 border border-gray-300 bg-white outline-none focus:border-orange-400 transition-colors mb-4 resize-none"
                ></textarea>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-full py-3 bg-[#f47a3c] hover:bg-orange-500 active:scale-95 text-white font-bold border-none rounded-full tracking-wider transition-all duration-200"
                >
                    SUBMIT
                </button>

            </form>
        </div>

    </div>

</body>
</html>
