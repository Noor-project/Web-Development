<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
    function validateForm() {

        let email = document.getElementById("email").value;
        let pass  = document.getElementById("pass").value;
        let cpass = document.getElementById("cpass").value;

        let emailError = "";
        let passError  = "";
        let cpassError = "";

        if (!email.includes("@")) {
            emailError = "Please enter a valid email address";
        }

        if (pass.length < 8) {
            passError = "Password must be at least 8 characters";
        }

        if (pass !== cpass) {
            cpassError = "Passwords don't match";
        }

        document.getElementById("emailError").innerHTML = emailError;
        document.getElementById("passError").innerHTML  = passError;
        document.getElementById("cpassError").innerHTML = cpassError;

        if (emailError === "" && passError === "" && cpassError === "") {
            alert("Form Submitted Successfully!");
            return true;
        }

        return false;
    }
    </script>

</head>
<body class="font-sans bg-[#4a73d9] min-h-screen">

    <!-- CONTAINER -->
    <div class="flex justify-around items-center mt-20 px-6">

        <!-- LEFT TEXT -->
        <div class="text-white text-5xl font-bold leading-tight">
            Form<br/>
            Validation<br/>
            JavaScript
        </div>

        <!-- FORM BOX -->
        <div class="bg-white p-6 w-80 rounded-lg shadow-lg">

            <h3 class="text-xl font-bold mb-4">Signup</h3>

            <form onsubmit="return validateForm()">

                <!-- Email -->
                <input
                    type="text"
                    id="email"
                    placeholder="Enter Email"
                    class="w-full px-3 py-2 my-2 border border-gray-300 rounded outline-none focus:border-[#4a73d9] transition-colors"
                />
                <div id="emailError" class="text-red-500 text-xs mb-1"></div>

                <!-- Password -->
                <input
                    type="password"
                    id="pass"
                    placeholder="Enter Password"
                    class="w-full px-3 py-2 my-2 border border-gray-300 rounded outline-none focus:border-[#4a73d9] transition-colors"
                />
                <div id="passError" class="text-red-500 text-xs mb-1"></div>

                <!-- Confirm Password -->
                <input
                    type="password"
                    id="cpass"
                    placeholder="Confirm Password"
                    class="w-full px-3 py-2 my-2 border border-gray-300 rounded outline-none focus:border-[#4a73d9] transition-colors"
                />
                <div id="cpassError" class="text-red-500 text-xs mb-1"></div>

                <br/>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-full py-3 bg-[#4a73d9] text-white font-semibold rounded hover:bg-blue-700 active:scale-95 transition-all duration-200"
                >
                    Signup Now
                </button>

            </form>
        </div>
    </div>

</body>
</html>
