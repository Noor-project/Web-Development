<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0 overflow-hidden">

    <!-- WRAPPER - position relative so form can be absolute inside -->
    <div class="relative flex h-[600px]">

        <!-- LEFT BLACK PANEL (35%) -->
        <div class="w-[35%] bg-black text-white">

            <p class="mt-[20%] text-center text-3xl font-bold">Location</p>
            <p class="mt-[5%] text-center text-lg">28 Jackson Blvd Ste 1020 Chicago</p>
            <p class="mt-[5%] text-center text-lg">IL 60604-2340</p>

            <p class="mt-[15%] text-center text-3xl font-bold">Follow Us</p>
            <img src="logos.png" alt="facebook" class="mt-[5%] block mx-auto"/>

            <p class="mt-[5%] text-center text-lg">&copy; 2018 Privacy Policy</p>

        </div>

        <!-- MIDDLE ORANGE PANEL (30%) -->
        <div class="w-[30%] bg-yellow-500"></div>

        <!-- RIGHT BLACK PANEL (35%) -->
        <div class="w-[35%] bg-black"></div>

        <!-- FORM - absolute on top, same as original margin-top:120px margin-left:700px -->
        <form class="absolute top-[120px] left-[700px] text-white">

            <h1 class="text-3xl font-bold mb-4">Contact Form</h1>

            <!-- Name -->
            <input
                type="text"
                name="Name"
                placeholder="Enter Your Name"
                class="w-full h-[25px] px-2 mb-4 bg-transparent border border-[rgb(189,249,229)] text-white placeholder-white outline-none"
            /><br/><br/>

            <!-- Email -->
            <input
                type="email"
                name="Email"
                placeholder="Enter Your valid Email"
                class="w-full h-[25px] px-2 mb-4 bg-transparent border border-[rgb(189,249,229)] text-white placeholder-white outline-none"
            /><br/><br/>

            <!-- Message -->
            <textarea
                name="Message"
                rows="6"
                cols="40"
                placeholder="Enter Your Message"
                class="px-2 py-1 bg-transparent border border-[rgb(189,249,229)] text-white placeholder-white outline-none resize-none"
            ></textarea><br/><br/>

            <!-- Submit -->
            <input
                type="submit"
                value="Submit"
                class="w-[30%] h-[25px] bg-yellow-500 text-white text-lg border border-blue-50 cursor-pointer hover:bg-orange-600"
            />

        </form>

    </div>

</body>
</html>
