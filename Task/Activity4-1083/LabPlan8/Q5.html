<!DOCTYPE html>
<html>
<head>
  <title>Contact Us</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 font-sans bg-gradient-to-r from-[#6a3dd9] to-[#5b2bd1] min-h-screen">

  <!-- TOP SECTION -->
  <div class="relative text-center pt-16 pb-10">

    <!-- Yellow Circle 1 -->
    <div class="absolute w-[220px] h-[220px] bg-[#f7b733] rounded-full top-[100px] left-[30%] z-0"></div>

    <!-- Yellow Circle 2 -->
    <div class="absolute w-[220px] h-[220px] bg-[#f7b733] rounded-full top-[80px] left-[55%] z-0"></div>

    <!-- Image -->
    <img src="Scholar.jpg" class="w-[250px] h-[250px] rounded-full relative z-10 object-cover inline-block">

  </div>

  <!-- CONTAINER -->
  <div class="w-[800px] mx-auto mt-10 bg-[#eeeeee] flex">

    <!-- LEFT SIDE -->
    <div class="w-1/2 p-8">
      <h2 class="text-[#6a3dd9] text-2xl font-bold mb-4">Contact Us</h2>

      <div class="mb-3">
        <label class="text-gray-700 text-sm">Name</label>
        <input type="text" placeholder="Enter your name"
          class="w-full border-0 border-b-2 border-[#6a3dd9] bg-transparent mt-1 mb-3 p-2 outline-none focus:border-purple-900"/>
      </div>

      <div class="mb-3">
        <label class="text-gray-700 text-sm">Email</label>
        <input type="email" placeholder="Enter a valid email address"
          class="w-full border-0 border-b-2 border-[#6a3dd9] bg-transparent mt-1 mb-3 p-2 outline-none focus:border-purple-900"/>
      </div>

      <div class="mb-3">
        <label class="text-gray-700 text-sm">Message</label>
        <textarea rows="4"
          class="w-full border-0 border-b-2 border-[#6a3dd9] bg-transparent mt-1 mb-3 p-2 outline-none focus:border-purple-900 resize-none"></textarea>
      </div>

      <div class="flex items-center gap-2 mb-4">
        <input type="checkbox" class="accent-[#6a3dd9] w-4 h-4"/>
        <span class="text-sm text-gray-700">I accept the Terms of Service</span>
      </div>

      <button class="w-full py-3 bg-[#6a3dd9] text-white border-0 rounded-md hover:bg-purple-900 transition-colors font-semibold tracking-wide">
        SUBMIT
      </button>
    </div>

    <!-- RIGHT SIDE -->
    <div class="w-1/2 p-8 bg-[#dddddd] text-center">

      <h4 class="text-[#6a3dd9] font-bold text-lg mb-1">CALL US</h4>
      <p class="text-gray-700 mb-5 text-sm">1 (234) 567-891<br>1 (234) 987-654</p>

      <h4 class="text-[#6a3dd9] font-bold text-lg mb-1">LOCATION</h4>
      <p class="text-gray-700 mb-5 text-sm">121 Rock Street, 21 Avenue,<br>New York, NY</p>

      <h4 class="text-[#6a3dd9] font-bold text-lg mb-1">OUR TOP SERVICES</h4>
      <p class="text-gray-700 text-sm">Self-Studying<br>Online Courses<br>Challenge Yourself</p>

    </div>
  </div>

</body>
</html>
