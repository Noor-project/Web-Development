<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q5 - Random Number</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-md w-96">
    <label class="block mb-1 font-medium">Starting Value</label>
    <input id="n1" type="text" placeholder="Enter only Numeric Value"
      class="w-full border-2 border-blue-500 focus:border-blue-700 focus:outline-none rounded-lg px-4 py-2 mb-4">

    <label class="block mb-1 font-medium">Ending Value</label>
    <input id="n2" type="text" placeholder="Enter only Numeric Value"
      class="w-full border-2 border-blue-500 focus:border-blue-700 focus:outline-none rounded-lg px-4 py-2 mb-6">

    <div class="flex flex-col space-y-4">
  <button onclick="generateRandom()"
    class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg">
    Generate
  </button>
  <button onclick="resetForm()"
    class="bg-red-400 hover:bg-red-500 text-white font-semibold py-2 rounded-lg">
    Reset
  </button>
</div>

    <div id="result" class="mt-6 text-center text-2xl font-bold text-green-600 hidden"></div>
  </div>

  <script>
    function generateRandom() {
      var a = document.getElementById('n1').value.trim();
      var b = document.getElementById('n2').value.trim();

      if (a === '' || b === '') {
        alert('Please fill all fields!');
        return;
      }
      if (isNaN(a) || isNaN(b) || a.includes('.') || b.includes('.')) {
        alert('Enter integers only (no decimal points)!');
        return;
      }

      a = parseInt(a); b = parseInt(b);

      if (b <= a) {
        alert('Maximum must be greater than minimum!');
        return;
      }

      var rand = Math.floor(Math.random() * (b - a + 1)) + a;

      var result = document.getElementById('result');
      result.textContent = 'Random Number: ' + rand;
      result.classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('n1').value = '';
      document.getElementById('n2').value = '';
      var result = document.getElementById('result');
      result.textContent = '';
      result.classList.add('hidden');
    }
  </script>
</body>
</html>
