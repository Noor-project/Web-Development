<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q4 - Prime Number</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glow-input:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.3), 0 0 12px rgba(34,197,94,0.4);
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-md w-96">
    <label class="block mb-1 font-medium">Enter a Number <span class="text-sm text-red-400">(less than 1000)</span></label>
    <input id="n1" type="text" placeholder="Enter only Numeric Value"
      class="glow-input w-full border-2 border-gray-300 rounded-lg px-4 py-2 mb-6">

    <div class="flex gap-4">
      <button onclick="checkPrime()"
        class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg">
        Check Prime
      </button>
      <button onclick="resetForm()"
        class="flex-1 bg-red-400 hover:bg-red-500 text-white font-semibold py-2 rounded-lg">
        Reset
      </button>
    </div>
  </div>

  <script>
    function checkPrime() {
      var a = document.getElementById('n1').value.trim();

      if (a === '') {
        alert('Please enter a number!');
        return;
      }
      if (isNaN(a) || a.includes('.')) {
        alert('Enter numeric values only (no decimals)!');
        return;
      }

      a = parseInt(a);

      if (a >= 1000 || a < 2) {
        alert('Value must be between 2 and 999!');
        return;
      }

      var prime = true;
      for (var i = 2; i <= Math.sqrt(a); i++) {
        if (a % i === 0) {
          prime = false;
          break;
        }
      }

      if (prime) {
        alert(a + ' is a PRIME number!');
      } else {
        alert(a + ' is NOT a prime number!');
      }
    }

    function resetForm() {
      document.getElementById('n1').value = '';
    }
  </script>
</body>
</html>
