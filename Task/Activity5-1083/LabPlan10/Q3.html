<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex flex-col items-center mt-10">

<input id="year" type="number" placeholder="Enter year like 2024"
class="border p-2 rounded w-64 mb-4">

<button onclick="checkLeap()"
class="bg-blue-500 text-white px-4 py-2 rounded mb-4">
Check Leap Year
</button>

<table class="border border-black text-center">
    <thead class="bg-yellow-300">
        <tr>
            <th class="border px-4">Year</th>
            <th class="border px-4">Status</th>
        </tr>
    </thead>
    <tbody id="result"></tbody>
</table>

<script>
function checkLeap() {
    let year = document.getElementById("year").value;

    if (year === "") {
        alert("Enter a year!");
        return;
    }

    let isLeap = (year % 4 == 0 && year % 100 != 0) || (year % 400 == 0);

    let status = isLeap ? "Yes" : "No";

    document.getElementById("result").innerHTML += `
        <tr>
            <td class="border px-4">${year}</td>
            <td class="border px-4">${status}</td>
        </tr>
    `;
}
</script>

</body>
</html>
