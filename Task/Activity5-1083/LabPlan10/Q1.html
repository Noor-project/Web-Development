<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GCD Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-md w-96">
    <h2 class="text-2xl font-semibold mb-4 text-center">GCD Calculator</h2>

    <label class="block mb-1 font-medium" for="n1">First Positive Integer</label>
    <input
      id="n1"
      type="text"
      placeholder="Enter first positive number"
      class="w-full border-2 border-blue-500 focus:border-blue-700 focus:outline-none rounded-lg px-4 py-2 mb-4"
    />

    <label class="block mb-1 font-medium" for="n2">Second Positive Integer</label>
    <input
      id="n2"
      type="text"
      placeholder="Enter second positive number"
      class="w-full border-2 border-blue-500 focus:border-blue-700 focus:outline-none rounded-lg px-4 py-2 mb-6"
    />

    <div class="flex flex-col space-y-4 mb-4">
      <button
        onclick="calculateGCD()"
        class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg"
      >
        Calculate GCD
      </button>
      <button
        onclick="resetForm()"
        class="bg-red-400 hover:bg-red-500 text-white font-semibold py-2 rounded-lg"
      >
        Reset
      </button>
    </div>

    <div id="result" class="mt-4 text-center text-2xl font-bold text-green-600 hidden"></div>
  </div>

  <script>
    function getPositiveInteger(id) {
      const value = document.getElementById(id).value.trim();
      if (value === '') {
        alert('Please enter a number!');
        return null;
      }
      if (!/^\d+$/.test(value)) {
        alert('Enter positive number only!');
        return null;
      }
      const num = parseInt(value, 10);
      if (num <= 0) {
        alert('Number must be positive!');
        return null;
      }
      return num;
    }

    function calculateGCD() {
      const num1 = getPositiveInteger('n1');
      const num2 = getPositiveInteger('n2');

      if (num1 === null || num2 === null) {
        return; // Validation failed
      }

      // Euclidean Algorithm
      let a = num1;
      let b = num2;
      while (b !== 0) {
        const temp = b;
        b = a % b;
        a = temp;
      }

      const resultDiv = document.getElementById('result');
      resultDiv.textContent = `GCD of ${num1} and ${num2} is ${a}`;
      resultDiv.classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('n1').value = '';
      document.getElementById('n2').value = '';
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = '';
      resultDiv.classList.add('hidden');
    }
  </script>
</body>
</html>
