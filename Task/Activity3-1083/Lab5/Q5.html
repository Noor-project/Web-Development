<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body  align="center" style="background-color: rgb(72, 32, 32); color:white;">
<form>
<table align="center" style="background-color: rgb(44, 10, 10);" cellpadding="8">

<tr>
    <br><br>
    <td>Full name:</td>
    <td>
        <input type="text" name="full_name" /> 
    </td>
</tr>
<tr>
    <td>Email Address:</td>
    <td>
        <input type="text" name="email_address" value="Enter your email"/>
    </td>
</tr>   
<tr>
    <td>Phone Number:</td>
    <td><input type="text" name="phone_number" /></td>
</tr>
<tr>
    <td>Password:</td>
    <td><input type="password" name="password" /></td>
  </tr> 
  <tr>
    <td>Gender</td>
    <td>    
        <input type="radio" name="gender" value="male" /> Male
        <input type="radio" name="gender" value="female" /> Female
        <input type="radio" name="gender" value="other" /> Other
  </tr>
  <tr>
    <td>languages</td>
   <td> <select name="select_languages">
         <option value="select">Select a language</option>
        <option value="english">English</option>
        <option value="spanish">Spanish</option>
        <option value="french">French</option>  
    </select>
    </td>
  </tr> 
  <tr>
    <td>Zip Code</td>
    <td><input type="text" name="zip_code" /></td>
  </tr>  
<tr>
    <td>About</td>
    <br><br>
    <td>
        <textarea name="comments" rows="4" cols="50" value="Write about yourself"></textarea>
</tr>
</table>
<br><br>
    <input style="width:auto;" type="submit" value="Register"/>

</form>

</body>
</html>
