<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>
</head>

<body style="background-color:#e6caca; font-family:Arial;">

<h1 align="center">Student Registration Form</h1>

<form>
<table cellpadding="10" align="center">

<tr>
    <td>Roll No :</td>
    <td><input type="text" name="rollno"></td>
</tr>

<tr>
    <td>Student Name :</td>
    <td>
        <input type="text" name="firstname" placeholder="First Name">
        -
        <input type="text" name="lastname" placeholder="Last Name">
    </td>
</tr>

<tr>
    <td>Father's Name :</td>
    <td><input type="text" name="fathername"></td>
</tr>

<tr>
    <td>Date of Birth :</td>
    <td>
        <input type="text" placeholder="Day" size="4"> -
        <input type="text" placeholder="Month" size="6"> -
        <input type="text" placeholder="Year" size="6">
        (DD-MM-YYYY)
    </td>
</tr>

<tr>
    <td>Mobile No. :</td>
    <td>
        <input type="text" value="+91" size="3"> -
        <input type="text" name="mobile">
    </td>
</tr>

<tr>
    <td>Email Id :</td>
    <td><input type="email" name="email"></td>
</tr>

<tr>
    <td>Password :</td>
    <td><input type="password" name="password"></td>
</tr>

<tr>
    <td>Gender :</td>
    <td>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
    </td>
</tr>

<tr>
    <td>Department :</td>
    <td>
        <input type="checkbox"> CSE
        <input type="checkbox"> IT
        <input type="checkbox"> ECE
        <input type="checkbox"> Civil
        <input type="checkbox"> Mech
    </td>
</tr>

<tr>
    <td>Course :</td>
    <td>
        <select>
            <option>---------------- Select Current Course ----------------</option>
            <option>BCA</option>
            <option>BBA</option>
            <option>BSC</option>
            <option>BA</option>
        </select>
    </td>
</tr>

<tr>
    <td>Student Photo :</td>
    <td><input type="file"></td>
</tr>

<tr>
    <td>City :</td>
    <td><input type="text" name="city"></td>
</tr>

<tr>
    <td>Address :</td>
    <td>
        <textarea rows="4" cols="40"></textarea>
    </td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="submit" value="Register">
    </td>
</tr>

</table>
</form>

</body>
</html>
