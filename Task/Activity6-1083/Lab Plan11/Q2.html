<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sum of Natural Numbers</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="border-4 border-blue-600 rounded-lg p-6 max-w-md w-full shadow-lg bg-white">
  <div class="border border-blue-500 rounded-lg p-4 mb-4">
    <!-- Start Input -->
    <div class="mb-4">
      <label class="block mb-1 text-gray-700 font-medium">Start Value</label>
      <input
        type="number"
        id="start-input"
        placeholder="Start Value"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
      />
      <p id="start-error" class="text-red-600 text-sm mt-1 hidden">Plz Enter positive value</p>
    </div>
    <h2 class="text-2xl font-bold text-center text-black-600 mb-6">TO</h2>
    <!-- End Input -->
    <div class="mb-4">
      <label class="block mb-1 text-gray-700 font-medium">End Value</label>
      <input
        type="number"
        id="end-input"
        placeholder="End Value"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
      />
      <p id="end-error" class="text-red-600 text-sm mt-1 hidden">Plz Enter positive value</p>
    </div>
    <!-- Buttons -->
    <div class="flex gap-2 justify-center mb-4">
      <button
        onclick="calculateSum()"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-500"
      >
        OK
      </button>
      <button
        onclick="clearFields()"
        class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-300"
      >
        Cancel
      </button>
    </div>
    <!-- Result Display -->
    <div
      id="result"
      class="hidden border border-gray-300 rounded p-4 text-center bg-gray-50"
    >
      <p class="text-gray-700 mb-2">Sum of numbers from start to end:</p>
      <p
        id="sum-result"
        class="text-xl font-semibold text-blue-600 font-mono"
      ></p>
    </div>
  </div>
</div>

<script>
function calculateSum() {
  const startInput = document.getElementById('start-input');
  const endInput = document.getElementById('end-input');
  const startErr = document.getElementById('start-error');
  const endErr = document.getElementById('end-error');
  const resultDiv = document.getElementById('result');
  const resultText = document.getElementById('sum-result');

  // Hide error messages and result initially
  startErr.classList.add('hidden');
  endErr.classList.add('hidden');
  resultDiv.classList.add('hidden');

  const startVal = startInput.value.trim();
  const endVal = endInput.value.trim();

  const startNum = parseInt(startVal);
  const endNum = parseInt(endVal);

  let valid = true;

  if (startVal === '' || isNaN(startNum) || startNum < 1) {
    startErr.classList.remove('hidden');
    valid = false;
  }
  if (endVal === '' || isNaN(endNum) || endNum < 1) {
    endErr.classList.remove('hidden');
    valid = false;
  }
  if (!valid) return;

  if (startNum > endNum) {
    alert('Start value should be less than or equal to End value.');
    return;
  }

  let sum = 0;
  for (let i = startNum; i <= endNum; i++) {
    sum += i;
  }

  resultText.textContent = sum;
  resultDiv.classList.remove('hidden');
}

function clearFields() {
  document.getElementById('start-input').value = '';
  document.getElementById('end-input').value = '';
  document.getElementById('start-error').classList.add('hidden');
  document.getElementById('end-error').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
}
</script>

</body>
</html>
