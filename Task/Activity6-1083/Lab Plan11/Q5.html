<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Q5 - Temperature Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white flex items-center justify-center min-h-screen">

  <div class="border-2 border-blue-600 rounded p-8 w-96">

    <!-- Input Row -->
    <div class="flex items-center gap-4 mb-6">
      <input
        type="number"
        id="tempInput"
        placeholder=""
        class="border-2 border-gray-800 w-56 h-12 px-3 text-base outline-none"
      />
      <span id="inputErr" class="text-red-500 font-semibold text-sm hidden">Plz Enter positive value</span>
    </div>

    <!-- Radio Options -->
    <div class="space-y-3 mb-8">
      <label class="flex items-center gap-3 cursor-pointer">
        <input type="radio" name="tempType" value="cToF" class="w-5 h-5 accent-red-500"/>
        <span class="text-base font-semibold">Celsius to Fahrenheit</span>
      </label>
      <label class="flex items-center gap-3 cursor-pointer">
        <input type="radio" name="tempType" value="fToC" class="w-5 h-5 accent-red-500"/>
        <span class="text-base font-semibold">Fahrenheit to Celsius</span>
      </label>
      <label class="flex items-center gap-3 cursor-pointer">
        <input type="radio" name="tempType" value="cToK" class="w-5 h-5 accent-red-500"/>
        <span class="text-base font-semibold">Celsius to kelvin</span>
      </label>
      <label class="flex items-center gap-3 cursor-pointer">
        <input type="radio" name="tempType" value="kToC" class="w-5 h-5 accent-red-500"/>
        <span class="text-base font-semibold">Kelvin to Celsius</span>
      </label>
    </div>
    <p id="optErr" class="text-red-500 text-sm mb-3 hidden">⚠ Please select at least one option.</p>

    <!-- Buttons -->
    <div class="flex gap-4">
      <button
        onclick="convertTemp()"
        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold px-8 py-2 rounded">
        OK
      </button>
      <button
        onclick="cancelForm()"
        class="bg-gray-400 hover:bg-gray-500 text-white font-semibold px-6 py-2 rounded">
        Cancel
      </button>
    </div>

  </div>

  <script>
    function convertTemp() {
      const input = document.getElementById('tempInput');
      const inputErr = document.getElementById('inputErr');
      const optErr = document.getElementById('optErr');

      inputErr.classList.add('hidden');
      optErr.classList.add('hidden');

      const val = input.value.trim();
      const temp = parseFloat(val);

      if (val === '' || isNaN(temp) || temp < 0) {
        inputErr.classList.remove('hidden');
        return;
      }

      const selected = document.querySelector('input[name="tempType"]:checked');
      if (!selected) {
        optErr.classList.remove('hidden');
        return;
      }

      let result, message;

      if (selected.value === 'cToF') {
        result = (temp * (9 / 5) + 32).toFixed(2);
        message = `Celsius to Fahrenheit\n\n${temp}°C = ${result}°F\n\nFormula: F = C × (9/5) + 32`;
      } else if (selected.value === 'fToC') {
        result = ((temp - 32) * (5 / 9)).toFixed(2);
        message = `Fahrenheit to Celsius\n\n${temp}°F = ${result}°C\n\nFormula: C = (F - 32) × (5/9)`;
      } else if (selected.value === 'cToK') {
        result = (temp + 273.15).toFixed(2);
        message = `Celsius to Kelvin\n\n${temp}°C = ${result} K\n\nFormula: K = C + 273.15`;
      } else if (selected.value === 'kToC') {
        result = (temp - 273.15).toFixed(2);
        message = `Kelvin to Celsius\n\n${temp} K = ${result}°C\n\nFormula: C = K - 273.15`;
      }

      alert(message);
    }

    function cancelForm() {
      document.getElementById('tempInput').value = '';
      document.querySelectorAll('input[name="tempType"]').forEach(r => r.checked = false);
      document.getElementById('inputErr').classList.add('hidden');
      document.getElementById('optErr').classList.add('hidden');
    }
  </script>

</body>
</html>
