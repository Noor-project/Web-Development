<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Guess the Number</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

<div class="bg-white border border-gray-300 rounded-lg shadow-lg p-6 max-w-md  ">
     <input type="number" id="guess-input" placeholder="Enter only Numeric Value" class="flex-1 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"/>
  <div class="mb-4">
    <div class="flex flex-col space-y-2">
      <label class="flex items-center space-x-3 cursor-pointer">
        <input type="radio" name="level" value="basic" class="accent-green-500"/>
        <span class="font-medium">Basic Level</span>
      </label>
      <label class="flex items-center space-x-3 cursor-pointer">
        <input type="radio" name="level" value="inter" class="accent-green-500"/>
        <span class="font-medium">Intermediate Level</span>
      </label>
      <label class="flex items-center space-x-3 cursor-pointer">
        <input type="radio" name="level" value="adv" class="accent-green-500"/>
        <span class="font-medium">Advance Level</span>
      </label>
    </div>
  </div>
  <div id="level-error" class="text-red-500 text-sm mb-4 hidden">⚠ Please select a level first.</div>
  <div class="flex space-x-10 mb-4">

    <button onclick="checkGuess()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 font-semibold">Check</button>
    <button onclick="resetGame()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 font-semibold">Reset</button>
  </div>
  <div id="message" class="text-sm text-gray-700 mb-2"></div>
  <div id="history" class="max-h-40 overflow-y-auto border border-gray-200 rounded p-2 text-sm bg-gray-50"></div>
</div>

<script>
let secretNumber, minRange, maxRange, attempts;

function startGame() {
  const selectedLevel = document.querySelector('input[name="level"]:checked');
  const levelError = document.getElementById('level-error');

  if (!selectedLevel) {
    levelError.classList.remove('hidden');
    return;
  } else {
    levelError.classList.add('hidden');
  }

  const ranges = {
    basic: [1, 10],
    inter: [50, 100],
    adv: [101, 500]
  };

  [minRange, maxRange] = ranges[selectedLevel.value];
  secretNumber = Math.floor(Math.random() * (maxRange - minRange + 1)) + minRange;
  attempts = 0;

  document.getElementById('message').textContent = `Guess a number between ${minRange} and ${maxRange}`;
  document.getElementById('history').innerHTML = '';
  document.getElementById('guess-input').value = '';
  document.getElementById('guess-input').disabled = false;
}

function checkGuess() {
  const input = document.getElementById('guess-input');
  const messageDiv = document.getElementById('message');
  const historyDiv = document.getElementById('history');
  const value = parseInt(input.value);

  if (isNaN(value) || value < minRange || value > maxRange) {
    messageDiv.textContent = `⚠ Enter a number between ${minRange} and ${maxRange}.`;
    return;
  }

  attempts++;
  if (value === secretNumber) {
    historyDiv.innerHTML += `<div class="text-green-600 font-semibold">🎉 Correct! The number was ${secretNumber}. You got it in ${attempts} attempt(s).</div>`;
    input.disabled = true;
  } else if (value < secretNumber) {
    historyDiv.innerHTML += `<div class="text-blue-500">Attempt ${attempts}: ${value} → Too Low ↑</div>`;
  } else {
    historyDiv.innerHTML += `<div class="text-red-500">Attempt ${attempts}: ${value} → Too High ↓</div>`;
  }
  historyDiv.scrollTop = historyDiv.scrollHeight;
  input.value = '';
}

function resetGame() {
  document.getElementById('message').textContent = '';
  document.getElementById('history').innerHTML = '';
  document.getElementById('guess-input').disabled = false;
  document.querySelector('input[name="level"]:checked').checked = false;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    checkGuess();
  }
});
</script>
</body>
</html>
