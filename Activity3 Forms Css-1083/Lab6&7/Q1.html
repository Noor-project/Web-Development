<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Application Form</title>
</head>
<body>

<h1>Application Form</h1>

<form>

<table>

    <tr>
        <td>
            Full Name:
            <input type="text" name="full_name">
            Last Name:
            <input type="text" name="last_name">
           </td>
    </tr>
    <td>
         <br>
    </td>
    <tr>
        <td>
            Date of Birth:
            <input type="date" name="dob">
            Age:
            <input type="number" name="age">
        </td>
    </tr>
     <td>
         <br>
    </td>
    <tr>
            <td>Gender:
            <select name="Gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
         Email Address:
            <input type="email" name="email">
        </td>
    </tr>
    <td>
         <br>
    </td>
    <tr>
        <td>
            Positions Available:
            <input type="radio" name="Positions" value="junior"> Junior Developer
            <input type="radio" name="Positions" value="mid"> Mid-Level Developer
            <input type="radio" name="Positions" value="senior"> Senior Developer
            <br><br>
            Programming Languages:
            <input type="checkbox" name="skills" value="web"> Java
            <input type="checkbox" name="skills" value="data"> JavaScript
            <input type="checkbox" name="skills" value="mobile"> Python
        </td>
    </tr>
    <td>
         <br>
    </td>
    <tr>
        <td>
            Password:
            <input type="password" name="password">
            Confirm Password:
            <input type="password" name="confirm_password">
        </td>
    </tr>
    <td>
         <br>
    </td>
    <tr>
        <td>
            <input type="submit" value="submit">
            <input type="reset" value="Reset">
        </td>
    </tr>

</table>

</form>

</body>
</html>
