<!DOCTYPE html>
<html>
<head>
<title>Login Form</title>

<style>

body{
    background:url("Background.jpg");
    background-size:cover;
    background-repeat:no-repeat;
    background-position:center;
    text-align:center;
    font-family:Arial;
    margin:0;
}


.box{
    background:rgba(255,255,255,0.9);
    width:300px;
    margin:120px auto;
    padding:20px;
    border-radius:10px;
}

/* inputs */
input{
    width:90%;
    padding:8px;
    margin:5px;
}

/* button */
button{
    width:95%;
    padding:10px;
    background:orangered;
    color:white;
    border:none;
    border-radius:20px;
}

/* links */
.links{
    font-size:12px;
    margin-top:10px;
}

</style>
</head>

<body>

<h2 style="color:orangered;">Login Form</h2>

<div class="box">

<form>

<label>Username</label><br>
<input type="text" placeholder="Enter your Username"><br><br>

<label>Password</label><br>
<input type="password" placeholder="Enter your Password"><br><br>

<input type="checkbox"> Remember me<br><br>

<button>LOGIN</button>

</form>

<div class="links">
<p>Don't have an account? | Forgot password?</p>
</div>

</div>

</body>
</html>
