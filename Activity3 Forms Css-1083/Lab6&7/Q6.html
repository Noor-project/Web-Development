<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <u><h2 style="text-align: center;">Project Management</h2></u>
    <form>
        <table style="margin-left: auto; margin-right: auto;align-content: center; background-color: aqua;">
           <tr>
            <td>
                Project Name
                <input type="text" name="projectname"value="Project Name">
            </td>
           </tr>
           <td>
            <br>
           </td>
              <tr>
                <td>
                Assigned To:
                <select name="assignedto">
                    <option value="Er Merry Petision">Er Merry Petision</option>
                    <option value="john">John</option>
                    <option value="michael">Michael</option>
                    <option value="sarah">Sarah</option>
                </td>
              </tr>
              <td>
            <br>
           </td>
           <tr>
            <td>
                Start Date:
                <input type="date" name="startdate">
            </td>
           </tr>
            <td>
            <br>
           </td>
           <tr>
            <td>
                End Date:
                <input type="date" name="enddate">
            </td>
           </tr>
                <td>
                <br>
                </td>
                <tr>
                    <td>
                        Priority:
                        <input type="radio" name="priority" value="high">High
                        <input type="radio" name="priority" value="medium">Average
                        <input type="radio" name="priority" value="low">Low  
                    </td>
                </tr>
                    <td>
                    <br>
                    </td>
                    <tr>
                        <td>
                            Description:
                            <textarea name="description" rows="4" cols="50"></textarea>
                        </td>
                    </tr>
            <td>
            <br>
            </td>
            <tr>
                <td>
                    <div style="display: flex; justify-content: center; gap: 10px;">
                    <input style="background-color: rgb(6, 196, 133);width: 80px; color: aliceblue;" type="submit" value="Submit">
                    <input style="background-color:rgb(59, 111, 208);width: 80px; color: aliceblue;" type="reset" value="clear">
                </div>
                </td>        
        </table>
    </form>
</body>
</html>
